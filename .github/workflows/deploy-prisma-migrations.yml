name: Deploy Prisma Migrations

on:
  workflow_call:
    inputs:
      orchestrated_by_backend:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: kaviar-prod-backend-db-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  CLUSTER: kaviar-cluster
  BACKEND_SERVICE: kaviar-backend-service
  BACKEND_CONTAINER_NAME: kaviar-backend
  ECR_REGISTRY: 847895361928.dkr.ecr.us-east-2.amazonaws.com
  ECR_REPOSITORY: kaviar-backend
  MIGRATION_FAMILY: kaviar-prisma-migration
  RDS_INSTANCE_ID: kaviar-prod-db
  RDS_DATABASE: kaviar

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" | \
          docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build and push migration image
        id: migration-image
        run: |
          set -euo pipefail

          MIGRATION_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:migration-${GITHUB_SHA}"

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Migration image: ${MIGRATION_IMAGE}"

          cd backend
          docker build --build-arg GIT_COMMIT="${GITHUB_SHA}" -t "${MIGRATION_IMAGE}" .
          docker push "${MIGRATION_IMAGE}"

          echo "image=${MIGRATION_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Resolve RDS managed secret and endpoint
        id: rds
        run: |
          set -euo pipefail

          RDS_JSON=$(aws rds describe-db-instances \
            --db-instance-identifier "$RDS_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'DBInstances[0].{SecretArn:MasterUserSecret.SecretArn,SecretStatus:MasterUserSecret.SecretStatus,Host:Endpoint.Address,Port:Endpoint.Port}' \
            --output json)

          SECRET_ARN=$(echo "$RDS_JSON" | jq -r '.SecretArn // empty')
          SECRET_STATUS=$(echo "$RDS_JSON" | jq -r '.SecretStatus // empty')
          DB_HOST=$(echo "$RDS_JSON" | jq -r '.Host // empty')
          DB_PORT=$(echo "$RDS_JSON" | jq -r '.Port // empty')

          if [ -z "$SECRET_ARN" ]; then
            echo "ABORT: RDS instance $RDS_INSTANCE_ID has no MasterUserSecret.SecretArn" >&2
            exit 1
          fi

          if [ "$SECRET_STATUS" != "active" ]; then
            echo "ABORT: RDS MasterUserSecret status is '$SECRET_STATUS', expected 'active'" >&2
            exit 1
          fi

          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ]; then
            echo "ABORT: Could not resolve RDS endpoint" >&2
            exit 1
          fi

          echo "secret_arn=$SECRET_ARN" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "db_port=$DB_PORT" >> "$GITHUB_OUTPUT"

          echo "RDS secret ARN resolved (status: $SECRET_STATUS)"
          echo "RDS endpoint: $DB_HOST:$DB_PORT"

      - name: Resolve backend ECS runtime config
        id: ecs
        run: |
          set -euo pipefail

          SERVICE_JSON=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$BACKEND_SERVICE" \
            --region "$AWS_REGION")

          TASK_DEFINITION=$(echo "$SERVICE_JSON" | jq -r '.services[0].taskDefinition')
          SUBNETS=$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.subnets | join(",")')
          SECURITY_GROUPS=$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.securityGroups | join(",")')
          ASSIGN_PUBLIC_IP=$(echo "$SERVICE_JSON" | jq -r '.services[0].networkConfiguration.awsvpcConfiguration.assignPublicIp')

          echo "task_definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"
          echo "subnets=$SUBNETS" >> "$GITHUB_OUTPUT"
          echo "security_groups=$SECURITY_GROUPS" >> "$GITHUB_OUTPUT"
          echo "assign_public_ip=$ASSIGN_PUBLIC_IP" >> "$GITHUB_OUTPUT"

          echo "Using backend task definition: $TASK_DEFINITION"
          echo "Using subnets: $SUBNETS"
          echo "Using security groups: $SECURITY_GROUPS"
          echo "Using assignPublicIp: $ASSIGN_PUBLIC_IP"

      - name: Register migration task definition
        id: migration-task
        run: |
          set -euo pipefail

          BACKEND_TASK_DEFINITION='${{ steps.ecs.outputs.task_definition }}'
          MIGRATION_IMAGE='${{ steps.migration-image.outputs.image }}'
          SECRET_ARN='${{ steps.rds.outputs.secret_arn }}'
          DB_HOST='${{ steps.rds.outputs.db_host }}'
          DB_PORT='${{ steps.rds.outputs.db_port }}'

          echo "Workflow SHA: ${GITHUB_SHA}"
          echo "Migration image (expected): ${MIGRATION_IMAGE}"
          echo "Base runtime task definition: ${BACKEND_TASK_DEFINITION}"

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            --region "$AWS_REGION")

          # Build the migration command: assemble DATABASE_URL in-memory from secrets, run prisma
          MIGRATE_CMD='node -e "
            const u = encodeURIComponent(process.env.MIGRATION_DB_USER);
            const p = encodeURIComponent(process.env.MIGRATION_DB_PASSWORD);
            const h = process.env.MIGRATION_DB_HOST;
            const port = process.env.MIGRATION_DB_PORT;
            const db = process.env.MIGRATION_DB_NAME;
            const url = \"postgresql://\" + u + \":\" + p + \"@\" + h + \":\" + port + \"/\" + db;
            const {execSync} = require(\"child_process\");
            execSync(\"npx prisma migrate deploy\", {
              stdio: \"inherit\",
              env: {...process.env, DATABASE_URL: url, MIGRATION_DB_USER: undefined, MIGRATION_DB_PASSWORD: undefined}
            });
          "'

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg family "$MIGRATION_FAMILY" \
            --arg container "$BACKEND_CONTAINER_NAME" \
            --arg migrationImage "$MIGRATION_IMAGE" \
            --arg secretArn "$SECRET_ARN" \
            --arg dbHost "$DB_HOST" \
            --arg dbPort "$DB_PORT" \
            --arg dbName "$RDS_DATABASE" \
            --arg migrateCmd "$MIGRATE_CMD" '
              .taskDefinition
              | .family = $family
              | .containerDefinitions[0].name = $container
              | .containerDefinitions[0].image = $migrationImage
              | .containerDefinitions[0].command = ["sh", "-lc", $migrateCmd]
              | .containerDefinitions[0].secrets = [
                  { "name": "MIGRATION_DB_USER", "valueFrom": ($secretArn + ":username::") },
                  { "name": "MIGRATION_DB_PASSWORD", "valueFrom": ($secretArn + ":password::") }
                ]
              | .containerDefinitions[0].environment = (
                  (.containerDefinitions[0].environment // [])
                  | map(select(.name != "DATABASE_URL"))
                  | . + [
                      { "name": "MIGRATION_DB_HOST", "value": $dbHost },
                      { "name": "MIGRATION_DB_PORT", "value": $dbPort },
                      { "name": "MIGRATION_DB_NAME", "value": $dbName }
                    ]
                )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy
                )
            ')

          # Safety: ensure no DATABASE_URL or password in plaintext environment
          LEAKED=$(echo "$NEW_TASK_DEF" | jq -r '
            [.containerDefinitions[0].environment[]?.name]
            | map(select(. == "DATABASE_URL" or . == "MIGRATION_DB_PASSWORD" or . == "MIGRATION_DATABASE_URL"))
            | join(",")
          ')
          if [ -n "$LEAKED" ]; then
            echo "ABORT: sensitive variable found in plaintext environment: $LEAKED" >&2
            exit 1
          fi

          echo "$NEW_TASK_DEF" > migration-task-def.json

          MIGRATION_IMAGE_CONFIGURED=$(jq -r '.containerDefinitions[0].image' migration-task-def.json)
          echo "Migration image (configured): ${MIGRATION_IMAGE_CONFIGURED}"

          if [[ "$MIGRATION_IMAGE_CONFIGURED" != *"migration-${GITHUB_SHA}"* ]]; then
            echo "ABORT: migration image does not match current workflow SHA" >&2
            exit 1
          fi

          MIGRATION_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://migration-task-def.json \
            --region "$AWS_REGION" \
            | jq -r '.taskDefinition.taskDefinitionArn')

          echo "migration_task_definition=$MIGRATION_TASK_DEFINITION" >> "$GITHUB_OUTPUT"
          echo "migration_image=$MIGRATION_IMAGE_CONFIGURED" >> "$GITHUB_OUTPUT"
          echo "Registered migration task definition: $MIGRATION_TASK_DEFINITION"

      - name: Run Prisma migrate deploy in ECS
        id: migrate
        run: |
          set -euo pipefail

          TASK_DEFINITION='${{ steps.migration-task.outputs.migration_task_definition }}'
          SUBNETS='${{ steps.ecs.outputs.subnets }}'
          SECURITY_GROUPS='${{ steps.ecs.outputs.security_groups }}'
          ASSIGN_PUBLIC_IP='${{ steps.ecs.outputs.assign_public_ip }}'
          LOG_GROUP='/ecs/kaviar-backend'

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --platform-version 1.4.0 \
            --task-definition "$TASK_DEFINITION" \
            --count 1 \
            --started-by "github-actions-prisma-migrations" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}" \
            --region "$AWS_REGION" \
            | jq -r '.tasks[0].taskArn')

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "null" ]; then
            echo "Failed to start ECS migration task" >&2
            exit 1
          fi

          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          TASK_ID="${TASK_ARN##*/}"
          LOG_STREAM="ecs/${BACKEND_CONTAINER_NAME}/${TASK_ID}"
          echo "log_stream=$LOG_STREAM" >> "$GITHUB_OUTPUT"

          echo "Started task: $TASK_ARN"
          echo "Log stream: $LOG_STREAM"

          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_REGION"

          TASK_JSON=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_REGION")

          EXIT_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].exitCode // empty')
          STOPPED_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].stoppedReason // empty')
          CONTAINER_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].reason // empty')

          echo "stop_reason=$STOPPED_REASON" >> "$GITHUB_OUTPUT"
          echo "container_reason=$CONTAINER_REASON" >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          echo "Stopped reason: $STOPPED_REASON"
          echo "Container reason: $CONTAINER_REASON"
          echo "Exit code: ${EXIT_CODE:-unknown}"

          sleep 8
          echo "--- ECS task logs ---"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --region "$AWS_REGION" \
            --limit 200 \
            | jq -r '.events[].message'

          if [ -z "$EXIT_CODE" ] || [ "$EXIT_CODE" != "0" ]; then
            echo "Prisma migration task failed" >&2
            exit 1
          fi

      - name: Publish summary
        run: |
          {
            echo "### Prisma migration task"
            echo "- Workflow SHA: ${{ github.sha }}"
            echo "- Base runtime task definition: ${{ steps.ecs.outputs.task_definition }}"
            echo "- Migration image: ${{ steps.migration-task.outputs.migration_image }}"
            echo "- Migration task definition: ${{ steps.migration-task.outputs.migration_task_definition }}"
            echo "- Task ARN: ${{ steps.migrate.outputs.task_arn }}"
            echo "- Log stream: ${{ steps.migrate.outputs.log_stream }}"
            echo "- Exit code: ${{ steps.migrate.outputs.exit_code }}"
            echo "- Stop reason: ${{ steps.migrate.outputs.stop_reason }}"
          } >> "$GITHUB_STEP_SUMMARY"
