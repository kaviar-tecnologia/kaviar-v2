name: Deploy Email Inbound Worker

on:
  pull_request:
    paths:
      - 'cloudflare/email-inbound-worker/**'
      - '.github/workflows/deploy-email-inbound-worker.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/email-inbound-worker/**'
      - '.github/workflows/deploy-email-inbound-worker.yml'
  workflow_dispatch:

concurrency:
  group: kaviar-email-inbound-worker-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare/email-inbound-worker

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cloudflare/email-inbound-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run worker tests
        run: npm test

      - name: Validate Wrangler config
        run: npx --yes wrangler@4.120.0 deploy --dry-run --config wrangler.ci.toml

      - name: Deploy with Wrangler
        if: github.event_name != 'pull_request'
        run: npx --yes wrangler@4.120.0 deploy --config wrangler.ci.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INBOUND_EMAIL_WEBHOOK_SECRET: ${{ secrets.INBOUND_EMAIL_WEBHOOK_SECRET }}