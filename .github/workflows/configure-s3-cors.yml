name: Configure S3 CORS

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CONFIGURE_CORS to continue'
        required: true
        type: string

jobs:
  configure-cors:
    runs-on: ubuntu-latest
    if: ${{ inputs.confirmation == 'CONFIGURE_CORS' }}
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Add S3 CORS permissions to ECS Task Role
        run: |
          aws iam put-role-policy --role-name KaviarEcsTaskRole --policy-name KaviarS3Access --policy-document '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject",
                  "s3:HeadObject"
                ],
                "Resource": "arn:aws:s3:::kaviar-uploads-847895361928/*"
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:ListBucket",
                  "s3:GetBucketCORS",
                  "s3:PutBucketCORS"
                ],
                "Resource": "arn:aws:s3:::kaviar-uploads-847895361928"
              }
            ]
          }'

      - name: Set S3 Bucket CORS
        run: |
          aws s3api put-bucket-cors --bucket kaviar-uploads-847895361928 --cors-configuration '{
            "CORSRules": [
              {
                "AllowedHeaders": ["*"],
                "AllowedMethods": ["PUT", "GET", "HEAD"],
                "AllowedOrigins": ["https://app.kaviar.com.br", "https://kaviar.com.br", "http://localhost:5173", "http://localhost:5174"],
                "ExposeHeaders": ["ETag", "x-amz-request-id"],
                "MaxAgeSeconds": 3600
              }
            ]
          }'

      - name: Verify CORS
        run: |
          aws s3api get-bucket-cors --bucket kaviar-uploads-847895361928
          echo "✅ CORS configured successfully"
