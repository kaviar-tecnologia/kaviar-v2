name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA from main to deploy"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_PRODUCTION to continue"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DEPLOY_PRODUCTION" ]; then
            echo "❌ ABORT: confirmation must be exactly 'DEPLOY_PRODUCTION'"
            echo "   Received: '${{ inputs.confirmation }}'"
            exit 1
          fi

      - name: Validate commit SHA format
        run: |
          SHA="${{ inputs.commit_sha }}"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "❌ ABORT: commit_sha must be exactly 40 lowercase hexadecimal characters"
            echo "   Received: '${SHA}'"
            exit 1
          fi
          echo "✓ Inputs validated: SHA=${SHA}"

  validate-target-commit:
    needs: validate-inputs
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.validate.outputs.target_sha }}
      main_sha: ${{ steps.validate.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SHA is current HEAD of main
        id: validate
        run: |
          set -euo pipefail

          TARGET_SHA="${{ inputs.commit_sha }}"
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"

          echo "Target SHA: ${TARGET_SHA}"
          echo "Main SHA:   ${MAIN_SHA}"

          # Verify the target SHA exists as a commit
          if ! git cat-file -t "${TARGET_SHA}" 2>/dev/null | grep -q "commit"; then
            echo "❌ DEPLOY_TARGET_NOT_CURRENT_MAIN: SHA does not exist as a commit"
            exit 1
          fi

          # Verify the target SHA is EXACTLY the current HEAD of main
          if [ "${TARGET_SHA}" != "${MAIN_SHA}" ]; then
            echo "❌ DEPLOY_TARGET_NOT_CURRENT_MAIN: target is not the current HEAD of main"
            echo "   Target: ${TARGET_SHA}"
            echo "   Main:   ${MAIN_SHA}"
            echo "   Deploy only the current HEAD of main. For rollback, use the rollback workflow."
            exit 1
          fi

          echo "✓ Target SHA is the current HEAD of main"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"

  resolve-production-state:
    needs: validate-target-commit
    runs-on: ubuntu-latest
    outputs:
      production_sha: ${{ steps.resolve.outputs.production_sha }}
    steps:
      - name: Resolve production SHA from two sources
        id: resolve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
        run: |
          set -euo pipefail

          # 1. Get the task definition ARN from the running service
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster kaviar-cluster \
            --services kaviar-backend-service \
            --region us-east-2 \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ] || [ "$TASK_DEF_ARN" = "null" ]; then
            echo "❌ PRODUCTION_TASK_DEFINITION_NOT_FOUND"
            exit 1
          fi
          echo "Task definition: ${TASK_DEF_ARN}"

          # 2. Get the container image URI
          IMAGE_URI=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region us-east-2 \
            --query 'taskDefinition.containerDefinitions[?name==`kaviar-backend`].image | [0]' \
            --output text)

          if [ -z "$IMAGE_URI" ] || [ "$IMAGE_URI" = "None" ] || [ "$IMAGE_URI" = "null" ]; then
            echo "❌ PRODUCTION_CONTAINER_IMAGE_NOT_FOUND"
            exit 1
          fi
          echo "Image URI: ${IMAGE_URI}"

          # 3. Extract IMAGE_SHA from the image tag (URI must end in :40-hex-chars)
          IMAGE_SHA=""
          if echo "$IMAGE_URI" | grep -qE ':[0-9a-f]{40}$'; then
            IMAGE_SHA=$(echo "$IMAGE_URI" | grep -oE '[0-9a-f]{40}$')
          fi

          if [ -z "$IMAGE_SHA" ]; then
            echo "❌ PRODUCTION_IMAGE_SHA_INVALID"
            echo "   Image URI does not end with a valid 40-char hex SHA tag"
            echo "   URI: ${IMAGE_URI}"
            exit 1
          fi

          if ! echo "$IMAGE_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "❌ PRODUCTION_IMAGE_SHA_INVALID"
            echo "   Extracted SHA is not exactly 40 lowercase hexadecimal characters"
            echo "   IMAGE_SHA: ${IMAGE_SHA}"
            exit 1
          fi
          echo "IMAGE_SHA: ${IMAGE_SHA}"

          # 4. Get ENV_SHA from GIT_COMMIT environment variable
          ENV_SHA=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region us-east-2 \
            --query 'taskDefinition.containerDefinitions[?name==`kaviar-backend`].environment[?name==`GIT_COMMIT`].value | [0]' \
            --output text)

          if [ -z "$ENV_SHA" ] || [ "$ENV_SHA" = "None" ] || [ "$ENV_SHA" = "null" ]; then
            echo "❌ PRODUCTION_GIT_COMMIT_NOT_FOUND"
            exit 1
          fi

          if ! echo "$ENV_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "❌ PRODUCTION_GIT_COMMIT_INVALID"
            echo "   GIT_COMMIT is not exactly 40 lowercase hexadecimal characters"
            echo "   ENV_SHA: ${ENV_SHA}"
            exit 1
          fi
          echo "ENV_SHA: ${ENV_SHA}"

          # 5. Both sources must agree
          if [ "$IMAGE_SHA" != "$ENV_SHA" ]; then
            echo "❌ PRODUCTION_SHA_SOURCE_MISMATCH"
            echo "   IMAGE_SHA: ${IMAGE_SHA}"
            echo "   ENV_SHA:   ${ENV_SHA}"
            echo "   The image tag and GIT_COMMIT environment variable must match."
            exit 1
          fi

          echo "✓ Production SHA verified from two sources: ${IMAGE_SHA}"
          echo "production_sha=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"

  resolve-deploy-state:
    needs:
      - validate-target-commit
      - resolve-production-state
    runs-on: ubuntu-latest
    outputs:
      prisma_changed: ${{ steps.detect.outputs.prisma_changed }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      production_sha: ${{ steps.detect.outputs.production_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-target-commit.outputs.target_sha }}

      - name: Verify checkout SHA
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ needs.validate-target-commit.outputs.target_sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ CHECKOUT_SHA_MISMATCH: expected=${EXPECTED_SHA} actual=${ACTUAL_SHA}"
            exit 1
          fi
          echo "✓ Checkout verified: ${ACTUAL_SHA}"

      - name: Detect Prisma-related changes
        id: detect
        run: |
          set -euo pipefail

          TARGET_SHA="${{ needs.validate-target-commit.outputs.target_sha }}"
          PRODUCTION_SHA="${{ needs.resolve-production-state.outputs.production_sha }}"

          echo "Production SHA: ${PRODUCTION_SHA}"
          echo "Target SHA:     ${TARGET_SHA}"
          echo "Range:          ${PRODUCTION_SHA}..${TARGET_SHA}"

          # Verify PRODUCTION_SHA exists in the repository
          if ! git cat-file -t "${PRODUCTION_SHA}" 2>/dev/null | grep -q "commit"; then
            echo "❌ PRODUCTION_SHA_NOT_IN_REPOSITORY: ${PRODUCTION_SHA}"
            exit 1
          fi

          # Verify PRODUCTION_SHA is an ancestor of TARGET_SHA
          if ! git merge-base --is-ancestor "${PRODUCTION_SHA}" "${TARGET_SHA}"; then
            echo "❌ PRODUCTION_SHA_NOT_ANCESTOR_OF_TARGET"
            echo "   Production: ${PRODUCTION_SHA}"
            echo "   Target:     ${TARGET_SHA}"
            exit 1
          fi

          # If production is already at target, no changes
          if [ "${PRODUCTION_SHA}" = "${TARGET_SHA}" ]; then
            echo "Production already at target SHA. No changes."
            echo "base_sha=${PRODUCTION_SHA}" >> "$GITHUB_OUTPUT"
            echo "prisma_changed=false" >> "$GITHUB_OUTPUT"
            echo "production_sha=${PRODUCTION_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Diff from PRODUCTION_SHA to TARGET_SHA
          CHANGED_FILES=$(git diff --name-only "${PRODUCTION_SHA}" "${TARGET_SHA}")

          PRISMA_CHANGED="false"
          if echo "${CHANGED_FILES}" | grep -qE '^backend/prisma/(schema\.prisma|migrations/)'; then
            PRISMA_CHANGED="true"
          fi

          echo "base_sha=${PRODUCTION_SHA}" >> "$GITHUB_OUTPUT"
          echo "prisma_changed=${PRISMA_CHANGED}" >> "$GITHUB_OUTPUT"
          echo "production_sha=${PRODUCTION_SHA}" >> "$GITHUB_OUTPUT"
          echo "Prisma changed: ${PRISMA_CHANGED}"

  block-prisma-changes:
    needs:
      - validate-target-commit
      - resolve-deploy-state
    runs-on: ubuntu-latest
    steps:
      - name: Block deploy if Prisma changes detected
        run: |
          PRISMA_CHANGED="${{ needs.resolve-deploy-state.outputs.prisma_changed }}"
          if [ "${PRISMA_CHANGED}" != "false" ]; then
            echo "❌ PRISMA_CHANGES_REQUIRE_SEPARATE_MIGRATION_WORKFLOW"
            echo "   prisma_changed=${PRISMA_CHANGED} (expected 'false' to proceed)"
            echo "   If Prisma schema or migrations changed, run the migration workflow first."
            echo "   If detection failed, investigate before deploying."
            exit 1
          fi
          echo "✓ No Prisma changes detected — deploy may proceed"

  revalidate-target-commit:
    needs:
      - validate-target-commit
      - block-prisma-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate main has not advanced
        run: |
          set -euo pipefail

          TARGET_SHA="${{ needs.validate-target-commit.outputs.target_sha }}"
          git fetch --no-tags origin main
          CURRENT_MAIN="$(git rev-parse origin/main)"

          echo "Target SHA:   ${TARGET_SHA}"
          echo "Current main: ${CURRENT_MAIN}"

          if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
            echo "❌ DEPLOY_TARGET_BECAME_STALE"
            echo "   Target:       ${TARGET_SHA}"
            echo "   Current main: ${CURRENT_MAIN}"
            echo "   Main has advanced since the deploy was initiated."
            exit 1
          fi

          echo "✓ Main is still at target SHA"

  deploy:
    needs:
      - validate-inputs
      - validate-target-commit
      - resolve-production-state
      - resolve-deploy-state
      - block-prisma-changes
      - revalidate-target-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-target-commit.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify checkout SHA
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          EXPECTED_SHA="${{ needs.validate-target-commit.outputs.target_sha }}"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ CHECKOUT_SHA_MISMATCH: expected=${EXPECTED_SHA} actual=${ACTUAL_SHA}"
            exit 1
          fi
          echo "✓ Checkout verified: ${ACTUAL_SHA}"

      - name: Revalidate main before build
        env:
          TARGET_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
        run: |
          revalidate_main() {
            git fetch --no-tags origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
              echo "❌ DEPLOY_TARGET_BECAME_STALE"
              echo "   Target:       ${TARGET_SHA}"
              echo "   Current main: ${CURRENT_MAIN}"
              exit 1
            fi
            echo "✓ Main still at target: ${TARGET_SHA}"
          }
          revalidate_main

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install and type-check
        run: |
          cd backend
          npm ci
          npx prisma generate
          npx tsc --noEmit -p tsconfig.build.json

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-2 | \
          docker login --username AWS --password-stdin 847895361928.dkr.ecr.us-east-2.amazonaws.com

      - name: Build and Push (immutable SHA tag only)
        env:
          DEPLOY_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
          TARGET_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
        run: |
          revalidate_main() {
            git fetch --no-tags origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
              echo "❌ DEPLOY_TARGET_BECAME_STALE"
              echo "   Target:       ${TARGET_SHA}"
              echo "   Current main: ${CURRENT_MAIN}"
              exit 1
            fi
            echo "✓ Main still at target: ${TARGET_SHA}"
          }

          cd backend
          docker build --build-arg GIT_COMMIT="${DEPLOY_SHA}" -t "kaviar-backend:${DEPLOY_SHA}" .
          docker tag "kaviar-backend:${DEPLOY_SHA}" "847895361928.dkr.ecr.us-east-2.amazonaws.com/kaviar-backend:${DEPLOY_SHA}"

          # Revalidate main after build, before push
          cd ..
          revalidate_main

          docker push "847895361928.dkr.ecr.us-east-2.amazonaws.com/kaviar-backend:${DEPLOY_SHA}"
          echo "✓ Pushed immutable image: 847895361928.dkr.ecr.us-east-2.amazonaws.com/kaviar-backend:${DEPLOY_SHA}"

      - name: Update Task Definition
        id: register_task
        env:
          DEPLOY_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
          TARGET_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
        run: |
          revalidate_main() {
            git fetch --no-tags origin main
            CURRENT_MAIN="$(git rev-parse origin/main)"
            if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
              echo "❌ DEPLOY_TARGET_BECAME_STALE"
              echo "   Target:       ${TARGET_SHA}"
              echo "   Current main: ${CURRENT_MAIN}"
              exit 1
            fi
            echo "✓ Main still at target: ${TARGET_SHA}"
          }

          # Revalidate before registering task definition
          revalidate_main

          TASK_DEF=$(aws ecs describe-task-definition --task-definition kaviar-backend --region us-east-2)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq --arg IMAGE "847895361928.dkr.ecr.us-east-2.amazonaws.com/kaviar-backend:${DEPLOY_SHA}" --arg COMMIT "${DEPLOY_SHA}" \
            --arg TWILIO_WHATSAPP_FROM "${{ secrets.TWILIO_WHATSAPP_FROM }}" \
            --arg TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID "${{ secrets.TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID }}" \
            --arg TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID "${{ secrets.TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID }}" \
            --arg TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID "${{ secrets.TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID }}" \
            --arg SUMUP_ENABLED "${{ secrets.SUMUP_ENABLED }}" \
            --arg SUMUP_BASE_URL "${{ secrets.SUMUP_BASE_URL }}" \
            --arg SUMUP_API_KEY "${{ secrets.SUMUP_API_KEY }}" \
            --arg SUMUP_PUBLIC_KEY "${{ secrets.SUMUP_PUBLIC_KEY }}" \
            --arg SUMUP_MERCHANT_CODE "${{ secrets.SUMUP_MERCHANT_CODE }}" '
            .taskDefinition |
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = [
              .containerDefinitions[0].environment[]?
              | select(
                  .name != "GIT_COMMIT"
                  and .name != "TWILIO_WHATSAPP_FROM"
                  and .name != "TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID"
                  and .name != "TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID"
                  and .name != "TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID"
                  and .name != "TWILIO_WHATSAPP_ENABLED"
                  and .name != "ENABLE_TWILIO_WHATSAPP"
                  and .name != "SUMUP_ENABLED"
                  and .name != "SUMUP_BASE_URL"
                  and .name != "SUMUP_API_KEY"
                  and .name != "SUMUP_PUBLIC_KEY"
                  and .name != "SUMUP_MERCHANT_CODE"
                )
            ] |
            .containerDefinitions[0].environment += [{"name": "GIT_COMMIT", "value": $COMMIT}] |
            .containerDefinitions[0].environment += [{"name": "TWILIO_WHATSAPP_ENABLED", "value": "true"}] |
            .containerDefinitions[0].environment += [{"name": "ENABLE_TWILIO_WHATSAPP", "value": "true"}] |
            (if $TWILIO_WHATSAPP_FROM != "" then .containerDefinitions[0].environment += [{"name": "TWILIO_WHATSAPP_FROM", "value": $TWILIO_WHATSAPP_FROM}] else . end) |
            (if $TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID != "" then .containerDefinitions[0].environment += [{"name": "TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID", "value": $TWILIO_WHATSAPP_TEMPLATE_DRIVER_SID}] else . end) |
            (if $TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID != "" then .containerDefinitions[0].environment += [{"name": "TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID", "value": $TWILIO_WHATSAPP_TEMPLATE_PASSENGER_SID}] else . end) |
            (if $TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID != "" then .containerDefinitions[0].environment += [{"name": "TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID", "value": $TWILIO_WHATSAPP_TEMPLATE_MANAGER_SID}] else . end) |
            (if $SUMUP_ENABLED != "" then .containerDefinitions[0].environment += [{"name": "SUMUP_ENABLED", "value": $SUMUP_ENABLED}] else . end) |
            (if $SUMUP_BASE_URL != "" then .containerDefinitions[0].environment += [{"name": "SUMUP_BASE_URL", "value": $SUMUP_BASE_URL}] else . end) |
            (if $SUMUP_API_KEY != "" then .containerDefinitions[0].environment += [{"name": "SUMUP_API_KEY", "value": $SUMUP_API_KEY}] else . end) |
            (if $SUMUP_PUBLIC_KEY != "" then .containerDefinitions[0].environment += [{"name": "SUMUP_PUBLIC_KEY", "value": $SUMUP_PUBLIC_KEY}] else . end) |
            (if $SUMUP_MERCHANT_CODE != "" then .containerDefinitions[0].environment += [{"name": "SUMUP_MERCHANT_CODE", "value": $SUMUP_MERCHANT_CODE}] else . end) |
            .containerDefinitions[0].healthCheck = {
              "command": ["CMD-SHELL", "node /app/healthcheck.js"],
              "interval": 30,
              "timeout": 5,
              "retries": 3,
              "startPeriod": 60
            } |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ')
          echo "$NEW_TASK_DEF" > task-def.json

          # Safety check: ensure sensitive values are NOT in environment
          LEAKED=$(echo "$NEW_TASK_DEF" | jq -r '[.containerDefinitions[0].environment[]?.name] | map(select(. == "DATABASE_URL" or . == "JWT_SECRET" or . == "JWT_RESET_SECRET" or . == "ADMIN_DEFAULT_PASSWORD" or . == "ASAAS_API_KEY" or . == "MERCADOPAGO_ACCESS_TOKEN" or . == "GOOGLE_PLACES_KEY")) | join(",")')
          if [ -n "$LEAKED" ]; then
            echo "❌ ABORT: Sensitive values found in plaintext environment: $LEAKED"
            exit 1
          fi

          NEW_REV=$(aws ecs register-task-definition --cli-input-json file://task-def.json --region us-east-2 | jq -r '.taskDefinition.revision')
          echo "Registered task definition: kaviar-backend:${NEW_REV}"
          echo "task_revision=${NEW_REV}" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster kaviar-cluster \
            --service kaviar-backend-service \
            --task-definition kaviar-backend:${{ steps.register_task.outputs.task_revision }} \
            --force-new-deployment \
            --region us-east-2

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster kaviar-cluster \
            --services kaviar-backend-service \
            --region us-east-2

      - name: Publish deploy summary
        if: always()
        env:
          DEPLOY_SHA: ${{ needs.validate-target-commit.outputs.target_sha }}
          MAIN_SHA: ${{ needs.validate-target-commit.outputs.main_sha }}
          PRISMA_CHANGED: ${{ needs.resolve-deploy-state.outputs.prisma_changed }}
        run: |
          {
            echo "### Backend Deploy Summary"
            echo "- Requested SHA: ${{ inputs.commit_sha }}"
            echo "- Main SHA at validation: ${MAIN_SHA}"
            echo "- Checkout SHA: ${DEPLOY_SHA}"
            echo "- Prisma changed: ${PRISMA_CHANGED}"
            echo "- Migrations: **not part of this workflow**"
            echo "- Image: \`847895361928.dkr.ecr.us-east-2.amazonaws.com/kaviar-backend:${DEPLOY_SHA}\`"
            echo "- Task revision: ${{ steps.register_task.outputs.task_revision || 'N/A' }}"
          } >> "$GITHUB_STEP_SUMMARY"
