name: Territorial Contract CI

on:
  pull_request:
    paths:
      - 'backend/src/routes/admin-payouts.ts'
      - 'backend/src/routes/admin-my-operator-profile.ts'
      - 'backend/src/services/contracts/**'
      - 'backend/tests/contract-template.test.ts'
      - 'backend/tests/territorial-manager-contract-v1_2.test.ts'
      - 'frontend-app/src/pages/admin/TerritorialPayoutsPage.jsx'
      - 'frontend-app/src/pages/admin/MyContractPage.jsx'
      - 'frontend-app/src/pages/admin/ManagerFinance.jsx'
      - 'frontend-app/src/pages/admin/ManagerHome.jsx'
      - 'frontend-app/src/pages/admin/RegionalAdminsPage.jsx'
      - 'frontend-app/src/pages/admin/TerritoryDetailPage.jsx'
      - 'frontend-app/src/pages/admin/ComercialGestorPage.jsx'
      - 'frontend-app/src/components/admin/DriverMunicipalRegularizationCard.jsx'
      - 'backend/src/routes/admin-manager-finance.ts'
      - 'backend/src/routes/admin-territories.ts'
      - 'backend/src/routes/admin-regulatory-consultation.ts'
      - 'docs/contratos/**'
      - 'docs/comercial/*.md'
      - 'docs/contrato-gestor-territorial-v1.md'
      - 'docs/territorial/gestor-territorial-kaviar-modelo-comercial-v1.1.md'

permissions:
  contents: read

jobs:
  contract-v1-2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kaviar_test:kaviar_test@127.0.0.1:5432/kaviar_contract_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend-app/package-lock.json

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend-app && npm ci

      - name: Generate Prisma Client
        run: cd backend && npx prisma generate

      - name: Run territorial contract tests
        run: |
          cd backend
          npx vitest run \
            tests/contract-template.test.ts \
            tests/territorial-manager-contract-v1_2.test.ts \
            tests/regional-admins-status.test.ts

      - name: Build backend
        run: cd backend && npm run build

      - name: Build frontend
        run: cd frontend-app && npm run build
