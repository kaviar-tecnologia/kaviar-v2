name: CARE-05B Territory and Fare Parity

on:
  pull_request:
    paths:
      - 'backend/src/services/care/care-operational-evidence.ts'
      - 'backend/src/services/care/care-fare-parity.ts'
      - 'backend/tests/care-05a-operational-evidence.test.ts'
      - 'backend/tests/care-05b-fare-parity.test.ts'
      - 'docs/care/CARE-05B-territory-and-pricing.md'
      - '.github/workflows/care-05b-ci.yml'
  workflow_dispatch:

jobs:
  territory-pricing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://care05b_ci:ci_password@127.0.0.1:5432/care05b_disposable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.build.json
      - name: Run CARE policy and regression tests
        working-directory: backend
        run: npx vitest run tests/care-05a-operational-evidence.test.ts tests/care-05b-fare-parity.test.ts tests/care-04c-runtime-eligibility.test.ts tests/care-04d-lifecycle-boundaries.test.ts tests/care-04-readiness-policy.test.ts tests/care-03-eligibility.test.ts
