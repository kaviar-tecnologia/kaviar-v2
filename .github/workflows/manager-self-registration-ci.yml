name: Manager Self Registration CI

on:
  pull_request:
    paths:
      - 'backend/src/services/territory/manager-self-registration.ts'
      - 'backend/src/routes/admin-my-operator-profile.ts'
      - 'backend/src/routes/admin-payouts.ts'
      - 'backend/tests/manager-self-registration*.test.ts'
      - 'backend/tests/manager-document-review-route.test.ts'
      - 'frontend-app/src/pages/admin/MyManagerRegistration.jsx'
      - 'frontend-app/src/pages/admin/MyContractPage.jsx'
      - 'frontend-app/src/pages/admin/ManagerHome.jsx'
      - 'frontend-app/src/pages/admin/TerritorialPayoutsPage.jsx'
      - 'frontend-app/src/components/admin/AdminApp.jsx'
      - '.github/workflows/manager-self-registration-ci.yml'
  push:
    branches: [main]
    paths:
      - 'backend/src/services/territory/manager-self-registration.ts'
      - 'backend/src/routes/admin-my-operator-profile.ts'
      - 'backend/src/routes/admin-payouts.ts'
      - 'backend/tests/manager-self-registration*.test.ts'
      - 'frontend-app/src/pages/admin/MyManagerRegistration.jsx'
      - 'frontend-app/src/pages/admin/MyContractPage.jsx'
      - 'frontend-app/src/pages/admin/ManagerHome.jsx'
      - 'frontend-app/src/pages/admin/TerritorialPayoutsPage.jsx'
      - 'frontend-app/src/components/admin/AdminApp.jsx'
      - '.github/workflows/manager-self-registration-ci.yml'

jobs:
  manager-self-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://kaviar_test:test@127.0.0.1:5432/kaviar_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-app/package-lock.json
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Typecheck backend
        run: cd backend && npx tsc --noEmit -p tsconfig.build.json
      - name: Test self-registration and contract safeguards
        run: cd backend && npx vitest run tests/manager-self-registration.test.ts tests/manager-self-registration-routes.test.ts tests/manager-document-review-route.test.ts tests/manager-application-prefill.test.ts tests/territorial-manager-contract-v1_2.test.ts
      - name: Install frontend dependencies
        run: cd frontend-app && npm ci
      - name: Build frontend
        run: cd frontend-app && npm run build
